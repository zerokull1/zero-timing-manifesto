name: CI Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust Toolchain (x86_64-unknown-uefi)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - name: Build Core Release
        run: cargo build --release
      - name: Build Bare-Metal UEFI Stage 0 (Ring -1 Hypervisor)
        run: |
          cd uefi_stage0
          cargo build --release
      - name: Build C-ABI Shared Libraries
        run: |
          rustc --crate-type cdylib -C panic=abort -O cisco_daq_plugin/lib.rs -o cisco_daq_plugin/libzero_cisco_daq.so
          rustc --crate-type cdylib -C panic=abort -O hft_exchange_bridge/lib.rs -o hft_exchange_bridge/libzero_hft_exchange.so
      - name: Run Offline Replay Smoke Test
        run: python3 tools/pcap_bench.py --count 10000
      - name: Verify Bare-Metal Ring -1 Hypervisor in QEMU OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf
          mkdir -p /tmp/ci_efi/EFI/BOOT
          cp uefi_stage0/target/x86_64-unknown-uefi/release/zero_os_monolith.efi /tmp/ci_efi/EFI/BOOT/BOOTX64.EFI
          printf 'FS0:\r\nEFI\\BOOT\\BOOTX64.EFI\r\n' > /tmp/ci_efi/startup.nsh
          timeout 25s qemu-system-x86_64 \
            -cpu max,+vmx \
            -m 256M \
            -bios /usr/share/ovmf/OVMF.fd \
            -drive format=raw,file=fat:rw:/tmp/ci_efi \
            -netdev user,id=net0 \
            -device e1000,netdev=net0,romfile="" \
            -serial stdio \
            -display none \
            -no-reboot | tee /tmp/qemu_ring1.log
          grep -q "Hardware Hypervisor Armed!" /tmp/qemu_ring1.log
      - name: Publish Release Artifacts on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            cisco_daq_plugin/libzero_cisco_daq.so
            hft_exchange_bridge/libzero_hft_exchange.so
            uefi_stage0/target/x86_64-unknown-uefi/release/zero_os_monolith.efi
            include/zero_timing.h
            tools/pcap_bench.py
